[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "enformer-training-guide"
version = "0.1.0"
description = "A path-configurable Enformer pretraining project"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Enformer training guide" }]
dependencies = [
    "accelerate>=0.26.0",
    "einops>=0.8.0",
    "h5py>=3.10.0",
    "huggingface-hub>=0.24.0",
    "numpy>=1.26.0,<3",
    "pandas>=2.1.0",
    "plotly>=7.0.0",
    "pyfaidx>=0.8.1",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
    "transformers>=4.49.0,<5",
    "wandb>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["enformer_pytorch", "dataloaders", "scripts"]

[tool.uv]
package = true
